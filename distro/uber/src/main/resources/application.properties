# Microcks uber distribution: embedded MongoDB-protocol server, WebSocket events, no Keycloak, no cluster.
# This file takes precedence over the application.properties of microcks-app.

# The microcks-app jar and the model jar carry no Jandex index: index them so CDI beans and entities are found.
quarkus.index-dependency.microcks-app.group-id=io.microcks
quarkus.index-dependency.microcks-app.artifact-id=microcks-app
quarkus.index-dependency.microcks-model.group-id=io.microcks
quarkus.index-dependency.microcks-model.artifact-id=microcks-model

# Embedded MongoDB: the server is started when microcks.uber.mongodb-url is first resolved (see
# EmbeddedMongoConfigSourceFactory). In-memory by default, persisted in a file when mongodb.storage.file or the
# MONGODB_STORAGE_PATH environment variable is set.
quarkus.mongodb.devservices.enabled=false
%prod.quarkus.mongodb.connection-string=${microcks.uber.mongodb-url}
%dev.quarkus.mongodb.connection-string=${microcks.uber.mongodb-url}
%test.quarkus.mongodb.connection-string=${microcks.uber.mongodb-url}

# A single instance: the cluster event bus (Hazelcast) is neither packaged nor started, events go straight to the
# WebSocket connections of the async minion.
quarkus.arc.exclude-types=io.microcks.cluster.**
%test.async-api.enabled=true

# Native executable
quarkus.native.additional-build-args=--initialize-at-run-time=net.datafaker,--initialize-at-run-time=sun.java2d.pipe.Region,--initialize-at-run-time=io.microcks.util.el.function.AbstractRandomELFunction,--initialize-at-run-time=org.h2,--initialize-at-run-time=de.bwaldvogel.mongo,--initialize-at-run-time=org.apache.commons.compress,--initialize-at-run-time=graphql.util.IdGenerator,--initialize-at-run-time=io.grpc.ManagedChannelRegistry,--initialize-at-run-time=io.grpc.NameResolverRegistry,--initialize-at-run-time=io.grpc.LoadBalancerRegistry,--initialize-at-run-time=io.microcks.security.ServiceAccountService,--initialize-at-run-time=io.microcks.web.OidcLoginController
quarkus.native.resources.includes=META-INF/services/**,proto2/include/**,proto3/include/**,leap_second_dates.csv
