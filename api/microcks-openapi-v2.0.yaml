        schema:
          type: string
        in: query
        required: false
      - name: error
        description: Error returned by the identity provider
        schema:
          type: string
        in: query
        required: false
      responses:
        "303":
          headers:
            Location:
              description: The redirect_uri of the login, with the Microcks token
                as a token query parameter
              schema:
                type: string
          description: Login succeeded, redirects the browser back to the application
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: The login failed (error, expired state, invalid ID token
            or refused by the guard claim)
        "403":
          description: This user has been disabled
        "404":
          description: OpenID Connect login is not enabled
      security: []
      operationId: CompleteOidcLogin
      summary: Complete an OpenID Connect login
      description: Callback registered at the identity provider. It is not meant
        to be called by API clients.
  /groups:
