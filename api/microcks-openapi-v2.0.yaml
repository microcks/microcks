      - admin
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: Created Membership (the existing one if already present)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid role, or neither or both of subject and email given
        "403":
          description: The caller is neither admin nor manager of this Group
        "404":
          description: No Group has this name
