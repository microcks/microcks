        }
    TestCaseReturnDTO:
      required:
      - operationName
      properties:
        operationName:
          description: Name of related operation for this TestCase
          type: string
    TestReturn:
      description: TestReturn is used for wrapping the return code of a test step
        execution
      required:
      - code
      - elapsedTime
      properties:
        code:
          description: "Return code for test (0 means Success, 1 means Failure)"
          type: integer
        elapsedTime:
          format: int64
          description: Elapsed time in milliseconds
          type: integer
        message:
          description: Error message if any
          type: string
        request:
          $ref: '#/components/schemas/Request'
          description: Request sent for this test
        response:
          $ref: '#/components/schemas/Response'
          description: Response returned for this test
        eventMessage:
          $ref: '#/components/schemas/EventMessage'
          description: Event Message received for this test
    Header:
      description: Transport headers for both Requests and Responses
      required:
      - name
      - values
      type: object
      properties:
        name:
          description: Unique distinct name of this Header
          type: string
        values:
          description: Values for this Header
          type: array
          items:
            type: string
    TestStepResult:
      description: TestStepResult is an entity embedded within TestCaseResult. They
        are created for each request associated with an operation / action of a microservice.
      required:
      - success
      - elapsedTome
      properties:
        success:
          description: Flag telling if test case is a success
          type: boolean
        elapsedTime:
          description: Elapsed time in milliseconds since the test step beginning
          type: number
        requestName:
          description: Name of request this test step is bound to
          type: string
        message:
          description: Error message that may be associated to this test step
          type: string
        eventMessageName:
          description: Name of event this test step is bound to
          type: string
    RequestResponsePair:
      description: Request associated with corresponding Response
      type: object
      allOf:
      - required:
        - request
        - response
        type: object
        properties:
          request:
            $ref: '#/components/schemas/Request'
            description: The request part of the pair
          response:
            $ref: '#/components/schemas/Response'
            description: The Response part of the pair
      - $ref: '#/components/schemas/AbstractExchange'
    OperationOverrideDTO:
      description: Data Transfer object for grouping the mutable properties of an
        Operation
      type: object
      properties:
        dispatcher:
          description: Type of dispatcher to apply for this operation
          type: string
        dispatcherRules:
          description: Rules of dispatcher for this operation
          type: string
        defaultDelay:
          description: Default delay in milliseconds to apply to mock responses on
            this operation
          type: integer
        parameterConstraints:
          description: Constraints that may apply to incoming parameters on this operation
          type: array
          items:
            $ref: '#/components/schemas/ParameterConstraint'
    ParameterConstraint:
      description: Companion object for Operation that may be used to express constraints
        on request parameters
      required:
      - name
      type: object
      properties:
        name:
          description: Parameter name
          type: string
        required:
          description: Whether it's a required constraint
          type: boolean
        recopy:
          description: Whether it's a recopy constraint
          type: boolean
        mustMatchRegexp:
          description: Whether it's a regular expression matching constraint
          type: string
        in:
          description: Parameter location
          enum:
          - path
          - query
          - header
          - cookie
          - formData
          type: string
    Metadata:
      description: Commodity object for holding metadata on any entity. This object
        is inspired by Kubernetes metadata.
      required:
      - createdOn
      - lastUpdate
      type: object
      properties:
        createdOn:
          description: Creation date of attached object
          type: number
          readOnly: true
        lastUpdate:
          description: Last update of attached object
          type: number
          readOnly: true
        annotations:
          description: Annotations of attached object
          type: object
          additionalProperties:
            type: string
        labels:
          description: Labels put on attached object
          type: object
          additionalProperties:
            type: string
    LabelsMap:
      description: A map which keys are already used labels keys and values are already
        used values for this key
      type: object
      additionalProperties:
        $ref: '#/components/schemas/StringArray'
        type: object
    UnidirectionalEvent:
      description: Representation of an unidirectional exchange as an event message
      type: object
      allOf:
      - required:
        - eventMessage
        type: object
        properties:
          eventMessage:
            $ref: '#/components/schemas/EventMessage'
            description: Asynchronous message for this unidirectional event
      - $ref: '#/components/schemas/AbstractExchange'
    StringArray:
      description: A simple array of String
      type: array
      items:
        type: string
    MessageArray:
      description: Array of Exchanges for Service operations
      type: array
      items:
        $ref: '#/components/schemas/Exchange'
    Exchange:
      oneOf:
      - $ref: '#/components/schemas/RequestResponsePair'
      - $ref: '#/components/schemas/UnidirectionalEvent'
      discriminator:
        propertyName: type
        mapping:
          reqRespPair: '#/components/schemas/RequestResponsePair'
          unidirEvent: '#/components/schemas/UnidirectionalEvent'
      description: "Abstract representation of a Service or API exchange type (request/response,\
        \ event based, ...)"
    AbstractExchange:
      description: Abstract bean representing a Service or API Exchange.
      required:
      - type
      type: object
      properties:
        type:
          description: Discriminant type for identifying kind of exchange
          enum:
          - reqRespPair
          - unidirEvent
          type: string
    ServiceView:
      description: Aggregate bean for grouping a Service an its messages pairs
      required:
      - service
      - messagesMap
      type: object
      properties:
        service:
          $ref: '#/components/schemas/Service'
          description: Wrapped service description
        messagesMap:
          description: "Map of messages for this Service. Keys are operation name,\
            \ values are array of messages for this operation"
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MessageArray'
    TestRequest:
      description: Test request is a minimalist wrapper for requesting the launch
        of a new test
      required:
      - serviceId
      - testEndpoint
      - runnerType
      - timeout
      properties:
        serviceId:
          description: Unique identifier of service to test
          type: string
        testEndpoint:
          description: Endpoint to test for this service
          type: string
        runnerType:
          $ref: '#/components/schemas/TestRunnerType'
          description: Runner used for this test
        timeout:
          format: int64
          description: The maximum time (in milliseconds) to wait for this test ends
          type: integer
        filteredOperations:
          description: A restriction on service operations to test
          type: array
          items:
            type: string
        secretName:
          description: The name of Secret to use for connecting the test endpoint
          type: string
        oAuth2Context:
          $ref: '#/components/schemas/OAuth2ClientContext'
          description: An OAuth2 context to use for retrieving an access token prior
            invoking the tested endpoint
        operationsHeaders:
          $ref: '#/components/schemas/OperationHeaders'
          description: This test operations headers override
    Resource:
      description: "Resource represents a Service or API artifacts such as specification,\
        \ contract"
      required:
      - id
      - name
      - content
      - type
      - serviceId
      type: object
      properties:
        id:
          description: Uniquer identifier of this Service or API Resource
          type: string
        name:
          description: Unique name/business identifier for this Service or API resource
          type: string
        content:
          description: String content of this resource
          type: string
        type:
          $ref: '#/components/schemas/ResourceType'
          description: Type of this Service or API resource
        serviceId:
          description: Unique identifier of the Servoce or API this resource is attached
            to
          type: string
        path:
          description: Relative path of this resource regarding main resource
          type: string
        sourceArtifact:
          description: Short name of the artifact this resource was extracted from
          type: string
    TestRunnerType:
      description: Type of test strategy (different strategies are implemented by
        different runners)
      enum:
      - HTTP
      - SOAP_HTTP
      - SOAP_UI
      - POSTMAN
      - OPEN_API_SCHEMA
      - ASYNC_API_SCHEMA
      - GRPC_PROTOBUF
      - GRAPHQL_SCHEMA
      type: string
    ArtifactUpload:
      description: |-
        Artifact to be imported by Microcks.
        This structure represents a mime-multipart file upload (as specified here: https://swagger.io/docs/specification/describing-request-body/file-upload/)
      required:
      - file
      type: object
      properties:
        file:
          format: binary
          description: The artifact to upload
          type: string
    Counter:
      description: A simple Counter type.
      type: object
      properties:
        counter:
          format: int32
          description: Number of items in a resource collection
          type: integer
      example: |-
        {
            "counter": 12
        }
    FeaturesConfig:
      title: Root Type for FeaturesConfig
      description: Representation of optional features configuration used by Microcks
        server
      type: object
      properties:
        repository-filter:
          description: Repository filtering feature properties
          type: object
          properties:
            label-label:
              type: string
            enabled:
              type: string
            label-list:
              type: string
            label-key:
              type: string
        microcks-hub:
          description: Microcks Hub feature properties
          type: object
          properties:
            allowed-roles:
              type: string
            endpoint:
              type: string
            enabled:
              type: string
        repository-tenancy:
          description: Repository tenancy feature properties
          type: object
          properties:
            enabled:
              type: string
            artifact-import-allowed-roles:
              type: string
        async-api:
          description: Asynchronous feature properties
          type: object
          properties:
            default-binding:
              type: string
            endpoint-MQTT:
              type: string
            endpoint-WS:
              type: string
            endpoint-KAFKA:
              type: string
            endpoint-AMQP:
              type: string
            endpoint-NATS:
              type: string
            endpoint-GOOGLEPUBSUB:
              type: string
            enabled:
              type: string
            frequencies:
              type: string
      additionalProperties: true
      example:
        repository-filter:
          label-label: Domain
          enabled: "true"
          label-list: "domain,status"
          label-key: domain
        microcks-hub:
          allowed-roles: "admin,manager,manager-any"
          endpoint: https://hub.microcks.io/api
          enabled: "true"
        repository-tenancy:
          enabled: "false"
          artifact-import-allowed-roles: "admin,manager,manager-any"
        async-api:
          default-binding: KAFKA
          endpoint-MQTT: my-mqtt-broker.apps.try.microcks.io
          endpoint-WS: localhost:8081
          endpoint-KAFKA: my-cluster-kafka-bootstrap.apps.try.microcks.io
          enabled: "false"
          frequencies: "3,10,30"
    SnapshotUpload:
      description: Upload of a repository snapshot file
      required:
      - file
      type: object
      properties:
        file:
          format: binary
          description: The repository snapshot file
          type: string
    HeaderDTO:
      description: Data Transfert Object for headers of both Requests and Responses
      required:
      - name
      - values
      type: object
      properties:
        name:
          description: Unique distinct name of this Header
          type: string
        values:
          description: Values for this header (comma separated strings)
          type: string
    OperationHeaders:
      description: "Specification of additional headers for a Service/API operations.\
        \ Keys are operation name or \"globals\" (if header applies to all), values\
        \ are Header objects DTO."
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/HeaderDTO'
    Service:
      description: Represents a Service or API definition as registred into Microcks
        repository
      required:
      - name
      - version
      - type
      - sourceArtifact
      properties:
        id:
          description: Unique identifier for this Service or API
          type: string
        name:
          description: Distinct name for this Service or API (maybe shared among many
            versions)
          type: string
        version:
          description: Distinct version for a named Service or API
          type: string
        type:
          description: Service or API Type
          enum:
          - REST
          - SOAP_HTTP
          - GENERIC_REST
          - GENERIC_EVENT
          - EVENT
          - GRPC
          - GRAPHQL
          type: string
        operations:
          description: Set of Operations for Service or API
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        xmlNS:
          description: Associated Xml Namespace in case of Xml based Service
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Metadata of Service
        sourceArtifact:
          description: Short name of the main/primary artifact this service was created
            from
          type: string
    Trend:
      description: Evolution trend qualifier
      enum:
      - DOWN
      - LOW_DOWN
      - STABLE
      - LOW_UP
      - UP
      type: string
    WeightedMetricValue:
      description: Value of a metric with an associated weight
      required:
      - name
      - weight
      - value
      type: object
      properties:
        name:
          description: Metric name or serie name
          type: string
        weight:
          description: Weight of this metric value (typically a percentage)
          type: integer
        value:
          description: The value of this metric
          type: integer
    DailyInvocationStatistic:
      description: The daily statistic of a service mock invocations
      required:
      - id
      - day
      - serviceName
      - serviceVersion
      - dailyCount
      type: object
      properties:
        id:
          description: Unique identifier of this statistic object
          type: string
        day:
          description: The day (formatted as yyyyMMdd string) represented by this
            statistic
          type: string
        serviceName:
          description: The name of the service this statistic is related to
          type: string
        serviceVersion:
          description: The version of the service this statistic is related to
          type: string
        dailyCount:
          description: The number of service mock invocations on this day
          type: number
        hourlyCount:
          description: The number of service mock invocations per hour of the day
            (keys range from 0 to 23)
          type: object
          additionalProperties: true
        minuteCount:
          description: The number of service mock invocations per minute of the day
            (keys range from 0 to 1439)
          type: object
          additionalProperties: true
    TestConformanceMetric:
      description: "Represents the test conformance metrics (current score, history\
        \ and evolution trend) of a Service"
      required:
      - id
      - serviceId
      - currentScore
      - maxPossibleScore
      type: object
      properties:
        id:
          description: Unique identifier of coverage metric
          type: string
        serviceId:
          description: Unique identifier of the Service this metric is related to
          type: string
        aggregationLabelValue:
          description: Value of the label used for metrics aggregation (if any)
          type: string
        maxPossibleScore:
          format: double
          description: Maximum conformance score that can be reached (depends on samples
            expresiveness)
          type: number
        currentScore:
          format: double
          description: Current test conformance score for the related Service
          type: number
        lastUpdateDay:
          description: The day of latest score update (in yyyyMMdd format)
          type: string
        latestTrend:
          $ref: '#/components/schemas/Trend'
          description: Evolution trend of currentScore
        latestScores:
          description: "History of latest scores (key is date with format yyyyMMdd,\
            \ value is score as double)"
          type: object
          additionalProperties:
            type: number
    TestResultSummary:
      description: 'Represents the summary result of a Service or API test run by
        Microcks. '
      required:
      - id
      - testDate
      - serviceId
      - success
      properties:
        id:
          description: Unique identifier of TestResult
          type: string
        testDate:
          format: int64
          description: Timestamp of creation date of this service
          type: integer
        serviceId:
          description: Unique identifier of service tested
          type: string
        success:
          description: Flag telling if test is a success
          type: boolean
    TestResult:
      description: "Represents the result of a Service or API test run by Microcks.\
        \ Tests are related to a service and made of multiple test cases corresponding\
        \ to each operations / actions composing service. Tests are run against a\
        \ specific endpoint named testedEndpoint. It holds global markers telling\
        \ if test still ran, is a success, how many times is has taken and so on ..."
      required:
      - id
      - version
      - testNumber
      - testDate
      - testedEndpoint
      - serviceId
      - success
      - inProgress
      - runnerType
      properties:
        id:
          description: Unique identifier of TestResult
          type: string
        version:
          description: Revision number of this test
          type: number
        testNumber:
          description: Incremental number for tracking number of tests of a service
          type: number
        testDate:
          format: int64
          description: Timestamp of creation date of this service
          type: integer
        testedEndpoint:
          description: Endpoint used during test
          type: string
        serviceId:
          description: Unique identifier of service tested
          type: string
        elapsedTime:
          description: Elapsed time in milliseconds since test beginning
          type: number
        success:
          description: Flag telling if test is a success
          type: boolean
        inProgress:
          description: Flag telling is test is still in progress
          type: boolean
        runnerType:
          $ref: '#/components/schemas/TestRunnerType'
          description: Runner used for this test
        testCaseResults:
          description: TestCase results associated to this test
          type: array
          items:
            $ref: '#/components/schemas/TestCaseResult'
        secretRef:
          $ref: '#/components/schemas/SecretRef'
          description: The referrence of the Secret used for connecting to test endpoint
        operationHeaders:
          $ref: '#/components/schemas/OperationHeaders'
          description: This test operations headers override
        timeout:
          description: The maximum time (in milliseconds) to wait for this test ends
          type: integer
        authorizedClient:
          $ref: '#/components/schemas/OAuth2AuthorizedClient'
          description: The OAuth2 authorized client that performed the test
    Binding:
      description: Protocol binding details for asynchronous operations
      required:
      - type
      - destinationName
      type: object
      properties:
        type:
          description: Protocol binding identifier
          enum:
          - KAFKA
          - MQTT
          - WS
          - AMQP
          - NATS
          - GOOGLEPUBSUB
          type: string
        keyType:
          description: Type of key for Kafka messages
          type: string
        destinationType:
          description: Type of destination for asynchronous messages of this operation
          type: string
        destinationName:
          description: Name of destination for asynchronous messages of this operation
          type: string
        qoS:
          description: Quality of Service attribute for MQTT binding
          type: string
        persistent:
          description: Persistent attribute for MQTT binding
          type: boolean
        method:
          description: HTTP method for WebSocket binding
          type: string
    ResourceType:
      description: Types of managed resources for Services or APIs
      enum:
      - WSDL
      - XSD
      - JSON_SCHEMA
      - OPEN_API_SPEC
      - OPEN_API_SCHEMA
      - ASYNC_API_SPEC
      - ASYNC_API_SCHEMA
      - AVRO_SCHEMA
      - PROTOBUF_SCHEMA
      - PROTOBUF_DESCRIPTION
      - GRAPHQL_SCHEMA
      - POSTMAN_COLLECTION
      type: string
    CounterMap:
      description: A generic map of counter
      type: object
      additionalProperties:
        type: number
    OAuth2GrantType:
      description: Enumeration for the different supported grants/flows of OAuth2
      enum:
      - PASSWORD
      - CLIENT_CREDENTIALS
      - REFRESH_TOKEN
      type: string
    OAuth2AuthorizedClient:
      description: OAuth2 authorized client that performed a test
      required:
      - grantType
      - principalName
      - tokenUri
      type: object
      properties:
        grantType:
          $ref: '#/components/schemas/OAuth2GrantType'
          description: OAuth2 authorization flow/grant type applied
        principalName:
          description: Name of authorized principal (clientId or username in the case
            of Password grant type)
          type: string
        tokenUri:
          description: Identity Provider URI used for token retrieval
          type: string
        scopes:
          description: Included scopes (separated using space)
          type: string
    ArtifactDownload:
      description: Artifact Download specification to be imported by Microcks.
      required:
      - url
      type: object
      properties:
        url:
          description: The URL of remote artifact to download and import
          type: string
        mainArtifact:
          description: Whether this remote artifact should be imported as main/primary
            or secondary artifact. Default is true.
          type: boolean
        secretName:
          description: The name of a secret that can be used to authenticated when
            downloading remote artifact.
          type: string
    ImportJob:
      description: An ImportJob allow defining a repository artifact to poll for discovering
        Services and APIs mocks and tests
      required:
      - name
      - repositoryUrl
      properties:
        id:
          description: Unique identifier of ImportJob
          type: string
        name:
          description: Unique distinct name of this ImportJob
          type: string
        repositoryUrl:
          description: URL of mocks and tests repository artifact
          type: string
        repositoryDisableSSLValidation:
          description: Whether to disable SSL certificate verification when checking
            repository
          type: boolean
        frequency:
          description: Reserved for future usage
          type: string
        createdDate:
          format: int64
          description: Creation timestamp for this ImportJob
          type: integer
        lastImportDate:
          format: int64
          description: Timestamp of the last import
          type: integer
        lastImportError:
          description: Error message of last import (if any)
          type: string
        active:
          description: Whether this ImportJob is active (ie. scheduled for execution)
          type: boolean
        etag:
          description: Etag of repository URL during previous import. Is used for
            not re-importing if no recent changes
          type: string
        serviceRefs:
          description: References of Services discovered when checking repository
          type: array
          items:
            $ref: '#/components/schemas/ServiceRef'
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Metadata of ImportJob
        secretRef:
          $ref: '#/components/schemas/SecretRef'
          description: Reference of a Secret to used when checking repository
        mainArtifact:
          description: Flag telling if considered as primary or secondary artifact.
            Default to `true`
          type: boolean
    Message:
      description: "Common structure for Request, Response and EventMessage"
      required:
      - name
      - operationId
      type: object
      properties:
        id:
          description: Unique identifier of this message
          type: string
        name:
          description: Unique distinct name of this message
          type: string
        content:
          description: Body content for this message
          type: string
        operationId:
          description: Identifier of Operation this message is associated to
          type: string
        testCaseId:
          description: Unique identifier of TestCase this message is attached (in
            case of a test)
          type: string
        headers:
          description: Headers for this message
          type: array
          items:
            $ref: '#/components/schemas/Header'
    Request:
      description: A mock invocation or test request
      allOf:
      - type: object
        properties:
          responseId:
            description: Unique identifier of Response this Request is attached
            type: string
          queryParameters:
            description: Query parameters for this Request if any
            type: array
            items:
              $ref: '#/components/schemas/Parameter'
      - $ref: '#/components/schemas/Message'
    Response:
      description: A mock invocation or test response
      allOf:
      - type: object
        properties:
          status:
            description: Status of this Response
            type: string
          mediaType:
            description: Content type of this Response
            type: string
          dispatchCriteria:
            description: Dispatch criteria of this Response (in case of a mock)
            type: string
          isFault:
            description: Whether this Response represents a Fault
            type: boolean
      - $ref: '#/components/schemas/Message'
    EventMessage:
      description: A simple event message published or received in an asynchronous
        exchange
      type: object
      allOf:
      - required:
        - id
        - mediaType
        type: object
        properties:
          mediaType:
            description: Content type of message
            type: string
          dispatchCriteria:
            description: Dispatch criteria of this message (in case of a mock)
            type: string
      - $ref: '#/components/schemas/Message'
    Parameter:
      description: Companion objects for Request representing query parameter
      required:
      - name
      - value
      type: object
      properties:
        name:
          description: The name of the parameter
          type: string
        value:
          description: The value of this parameter
          type: string
    OAuth2ClientContext:
      description: Represents a volatile OAuth2 client context usually associated
        with a Test request
      required:
      - clientId
      - clientSecret
      - tokenUri
      - grantType
      type: object
      properties:
        clientId:
          description: Id for connecting to OAuth2 identity provider
          type: string
        clientSecret:
          format: password
          description: Secret for connecting to OAuth2 identity provider
          type: string
        tokenUri:
          description: URI for retrieving an access token from OAuth2 identity provider
          type: string
        username:
          description: Username in case you're using the Resource Owner Password flow
          type: string
        password:
          description: User password in case you're suing the Resource Owner password
            flow
          type: string
        refreshToken:
          description: Refresh token in case you're using the Refresh Token rotation
            flow
          type: string
        scopes:
          description: "The OAuth scopes to have in claimed token (delimited by space,\
            \ \"openid\" is applied by default)"
          type: string
        grantType:
          description: The OAuth2 grant type to apply for retrieving the token
          enum:
          - PASSWORD
          - CLIENT_CREDENTIALS
          - REFRESH_TOKEN
          type: string
    TriggerInfo:
      description: Information on a sync-to-async trigger.
      required:
      - serviceName
      - serviceVersion
      - operationName
      type: object
      properties:
        serviceName:
          description: The name of the service that is triggered
          type: string
        serviceVersion:
          description: The version of the service that is triggered
          type: string
        operationName:
          description: The name of the operation within the service that is triggered
          type: string
    CallbackInfo:
      description: Information on a REST api/service callback
      required:
      - method
      - callbackUrlExpression
      type: object
      properties:
        method:
          description: The HTTP method for this callback
          type: string
        callbackUrlExpression:
          description: The expressiong to retrieve the callback url from incoming
            request
          type: string
        order:
          description: The order of this callback within the chain
          type: integer
    Operation:
      description: An Operation of a Service or API
      required:
      - name
      - method
      type: object
      properties:
        name:
          description: Unique name of this Operation within Service scope
          type: string
        method:
          description: Represents transport method
          type: string
        inputName:
          description: Name of input parameters in case of Xml based Service
          type: string
        outputName:
          description: Name of output parameters in case of Xml based Service
          type: string
        dispatcher:
          description: Dispatcher strategy used for mocks
          type: string
        dispatcherRules:
          description: DispatcherRules used for mocks
          type: string
        defaultDelay:
          description: Default response time delay for mocks
          type: number
        resourcePaths:
          description: Paths the mocks endpoints are mapped on
          type: array
          items:
            type: string
        bindings:
          description: Map of protocol binding details for this operation
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Binding'
        defaultDelayStrategy:
          description: "The delay strategy to apply to default delay. Can be 'fixed',\
            \ 'random' or 'random-(\\d)' to specify a range around the default delay\
            \ value."
          type: string
        parameterConstraints:
          description: Constraints that may apply to mock invocation on this operation
          type: array
          items:
            $ref: '#/components/schemas/ParameterConstraint'
        triggerInfos:
          description: A list of trigger informations
          type: array
          items:
            $ref: '#/components/schemas/TriggerInfo'
        callbackInfos:
          description: Map of CallbackInfo where key is the name of the callback
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CallbackInfo'
    WebhookRegistration:
      description: A Webhook registration for a Service Operation. It represents a
        subscription to be notified of any change on the referenced Operation.
      required:
      - operationId
      - targetUrl
      properties:
        id:
          description: Unique identifier of the Webhook registration
          type: string
        createdOn:
          format: date-time
          description: Creation date of this Webhook registration
          type: string
        expiresAt:
          format: date-time
          description: Expiration date of this Webhook registration
          type: string
        operationId:
          description: Identifier of the subscribed Operation, formatted as {serviceId}-{operationName}
          type: string
        operationMethod:
          description: HTTP method of the subscribed Operation
          type: string
        targetUrl:
          description: Target URL where Microcks will invoke the Webhook
          type: string
        frequency:
          format: int64
          description: Invocation frequency in milliseconds (defaults to 3000)
          type: integer
        errorCount:
          description: Current number of consecutive invocation errors
          type: integer
        errorCountThreshold:
          description: Maximum number of consecutive errors before the Webhook is
            considered failed (defaults to 5)
          type: integer
    WebhookRegistrationRequest:
      description: Request payload used to register a new Webhook subscription
      required:
      - operationId
      - targetUrl
      properties:
        operationId:
          description: Identifier of the Operation to subscribe to, formatted as {serviceId}-{operationName}
          type: string
        targetUrl:
          description: Target URL where Microcks should invoke the Webhook
          type: string
        frequency:
          format: int64
          description: Invocation frequency in milliseconds (defaults to 3000)
          type: integer
        expiresAt:
          format: date-time
          description: Expiration date of this Webhook registration (defaults to 2
            days from now)
          type: string
        errorCountThreshold:
          description: Maximum number of consecutive errors before the Webhook is
            considered failed (defaults to 5)
          type: integer
    WorkflowRunRequest:
      description: Workflow run request is a minimalist wrapper for requesting the
        run of a workflow of an Arazzo document
      properties:
        inputs:
          description: The inputs of the workflow, by name
          type: object
          additionalProperties: {}
        timeout:
          format: int64
          description: The maximum time (in milliseconds) a step waits for its response
            (defaults to 10000)
          type: integer
        implementations:
          description: The base URL of the implementation of each linked source
            description, by source name. When absent, the workflow runs against
            the Microcks mocks
          type: object
          additionalProperties:
            type: string
        secretName:
          description: The name of Secret whose authorization every call to the
            implementations carries
          type: string
        validateSchema:
          description: Whether each response is validated against the OpenAPI schema
            of its operation (defaults to false)
          type: boolean
        example:
          description: The name of the recorded example of the workflow the run
            plays. Its inputs replace the given ones, and the run is judged on what
            it expects
          type: string
        target:
          description: Set to run some source descriptions on the Microcks mocks
            and the others on their implementations. Any other kind is refused
          type: object
          required:
          - kind
          properties:
            kind:
              enum:
              - mixed
              type: string
            perSource:
              description: "For each source description, mocks or implementations;\
                \ the latter use the base URL given in implementations"
              type: object
              additionalProperties:
                type: string
      example: |-
        {
            "inputs": {
                "pastry": "Eclair Cafe",
                "newPrice": 2.6
            },
            "implementations": {
                "pastryApi": "http://pastry-app:8080"
            }
        }
    WorkflowRunStatus:
      description: Status of a workflow run
      enum:
      - IN_PROGRESS
      - SUCCESS
      - FAILURE
      type: string
    WorkflowRunTarget:
      description: What a workflow run calls, the Microcks mocks, implementations, or mocks for some
        source descriptions and implementations for the others (MIXED)
      enum:
      - MOCKS
      - IMPLEMENTATIONS
      - MIXED
      type: string
    ArazzoSessionRequest:
      description: The workflow a verification session is opened on
      required:
      - documentId
      - workflowId
      properties:
        documentId:
          description: "Unique identifier of the Arazzo document, or its title and\
            \ version as {title}:{version} (for example Order saga:1.0.0)"
          type: string
        workflowId:
          description: Identifier of the workflow in the Arazzo document
          type: string
        inputs:
          description: The inputs of the workflow, by name. When given, they are
            checked against the inputs of the workflow, and the values the calls
            send from $inputs expressions must be theirs; when absent, no value
            coming from the inputs is checked
          type: object
          additionalProperties: {}
        failures:
          description: "Steps set to fail in the session, by step identifier, each\
            \ with the name of an existing example of the operation of the step\
            \ (for example {\"chargePayment\": \"card refused\"}). In this session\
            \ only, the mocks answer that operation with the example: its status,\
            \ headers and body"
          type: object
          additionalProperties:
            type: string
    ArazzoSession:
      description: A verification session on a workflow of an Arazzo document. The
        mocks record the calls naming it, in their order of receipt.
      required:
      - id
      - documentId
      - workflowId
      - openedDate
      - state
      properties:
        id:
          description: Unique identifier of the ArazzoSession, which the calls to
            the mocks name
          type: string
        state:
          description: Whether the session still records the calls naming it, or
            was closed
          type: string
          enum:
          - open
          - closed
        verificationRunId:
          description: Unique identifier of the WorkflowResult its latest verification
            created; absent while the session was not verified
          type: string
        documentId:
          description: Unique identifier of the Arazzo document
          type: string
        documentTitle:
          description: Title of the Arazzo document
          type: string
        documentVersion:
          description: Version of the Arazzo document
          type: string
        workflowId:
          description: Identifier of the workflow the session verifies
          type: string
        openedDate:
          format: int64
          description: Timestamp of the opening of the session
          type: integer
        closedDate:
          format: int64
          description: Timestamp of the closing of the session; absent while it
            is open
          type: integer
        expireAt:
          format: int64
          description: Timestamp the session expires at, with its calls
          type: integer
        callCount:
          format: int64
          description: How many calls the session recorded
          type: integer
        droppedCallCount:
          format: int64
          description: How many calls the session did not record, as it had recorded
            its maximum of calls
          type: integer
        inputs:
          description: The inputs of the workflow the session was opened with, by
            name; absent when it was opened without
          type: object
          additionalProperties: {}
        failures:
          description: Steps set to fail in the session, by step identifier, each
            with the name of the example the mocks answer them with
          type: object
          additionalProperties:
            type: string
    WorkflowSessionCall:
      description: A call the mocks recorded in a verification session
      required:
      - index
      - method
      - path
      properties:
        index:
          format: int64
          description: Place of the call in the order the session received its calls,
            from 0
          type: integer
        apiName:
          description: Name of the Microcks API whose mocks received the call
          type: string
        apiVersion:
          description: Version of that API
          type: string
        method:
          description: Method of the call
          type: string
        path:
          description: Path of the call, after the name and version of the API
          type: string
        stepId:
          description: The step of the workflow the call was matched to; absent when
            it matches none
          type: string
        failure:
          description: "Why the call fails the verification: it calls an operation\
            \ of a linked API that no remaining step of the workflow expects (for\
            \ example unexpected call `confirmOrder` after `chargePayment`); absent\
            \ when it does not"
          type: string
    WorkflowSessionCheck:
      description: The verification session a WorkflowResult whose origin is SESSION
        verifies
      required:
      - sessionId
      - calls
      properties:
        sessionId:
          description: Unique identifier of the ArazzoSession
          type: string
        calls:
          description: The calls the session recorded, in their order of receipt
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSessionCall'
    WorkflowRunOrigin:
      description: Where a workflow run was launched from, when not from the Microcks
        UI or API. MOCK_URL is an application posting the inputs of the workflow to
        its Mock URL, to get its outputs played on the Microcks mocks. SESSION is
        not a run but the verification of the calls an application made to the
        mocks in a verification session.
      enum:
      - MOCK_URL
      - SESSION
      type: string
    WorkflowStepStatus:
      description: Status of a step of a workflow run
      enum:
      - PASSED
      - FAILED
      - NOT_RUN
      type: string
    WorkflowSourceTarget:
      description: Where a source description of a workflow run is called
      required:
      - sourceName
      - apiName
      - apiVersion
      - baseUrl
      properties:
        sourceName:
          description: Name of the source description in the Arazzo document
          type: string
        serviceId:
          description: Unique identifier of the Microcks API it is linked to
          type: string
        apiName:
          description: Name of the Microcks API it is linked to
          type: string
        apiVersion:
          description: Version of the Microcks API it is linked to
          type: string
        baseUrl:
          description: Base URL its operations are called on
          type: string
    WorkflowStepOperation:
      description: The operation a step of a workflow run calls
      properties:
        sourceName:
          description: Name of the source description of the operation
          type: string
        operationId:
          description: Identifier of the operation
          type: string
        method:
          description: HTTP method of the operation
          type: string
        path:
          description: Path template of the operation
          type: string
    WorkflowExpressionValue:
      description: The value of a runtime expression when a step was run
      required:
      - expression
      properties:
        expression:
          description: The runtime expression, such as $statusCode
          type: string
        value:
          description: Its value
    WorkflowCriterionResult:
      description: A success criterion of a step, as evaluated
      required:
      - condition
      - held
      properties:
        condition:
          description: The condition of the criterion, such as $statusCode == 200
          type: string
        values:
          description: The values of the runtime expressions of the condition
          type: array
          items:
            $ref: '#/components/schemas/WorkflowExpressionValue'
        held:
          description: Whether the criterion held
          type: boolean
    WorkflowParameterValue:
      description: A parameter a step sent, resolved
      required:
      - name
      - in
      properties:
        name:
          description: Name of the parameter
          type: string
        in:
          description: Where it was sent (path, query or header)
          type: string
        value:
          description: The value it was sent with
        expression:
          description: The runtime expression the value came from; absent for
            a constant
          type: string
    WorkflowStepResult:
      description: The result of a step of a workflow run
      required:
      - index
      - stepId
      - status
      - elapsedTime
      properties:
        index:
          description: Place of the step in the execution order of the run, from
            0
          type: integer
        stepId:
          description: Identifier of the step in the workflow
          type: string
        operation:
          $ref: '#/components/schemas/WorkflowStepOperation'
          description: The operation the step called
        status:
          $ref: '#/components/schemas/WorkflowStepStatus'
          description: Status of the step
        statusCode:
          description: Status code of the response the step received
          type: integer
        elapsedTime:
          format: int64
          description: Elapsed time of the step in milliseconds
          type: integer
        criteria:
          description: The success criteria of the step, as evaluated
          type: array
          items:
            $ref: '#/components/schemas/WorkflowCriterionResult'
        outputs:
          description: The outputs of the step, by name
          type: object
          additionalProperties: {}
        testCaseId:
          description: Identifier of the request and response of the step, to
            read them with GetMessagesByTestCase
          type: string
        message:
          description: Why the step failed when no criterion tells it
          type: string
        requestUrl:
          description: Full URL of the request the step sent
          type: string
        parameters:
          description: The parameters the step sent, resolved
          type: array
          items:
            $ref: '#/components/schemas/WorkflowParameterValue'
        outputOrigins:
          description: The runtime expression each output of the step came from,
            by output name
          type: object
          additionalProperties:
            type: string
    WorkflowMissingExample:
      description: The example the Microcks mocks lack for a step of a run against
        them to pass
      properties:
        stepIndex:
          description: Place of the step in the execution order of the run
          type: integer
        stepId:
          description: Identifier of the step
          type: string
        serviceId:
          description: Unique identifier of the Microcks API of the operation
          type: string
        operationId:
          description: Identifier of the operation in its source description
          type: string
        operationName:
          description: Name of the operation in Microcks
          type: string
        parameters:
          description: The parameters the step sent
          type: array
          items:
            $ref: '#/components/schemas/WorkflowParameterValue'
    WorkflowResult:
      description: "Represents a run of a workflow of an Arazzo document by Microcks.\
        \ It is made of the result of each step, in their execution order, and holds\
        \ global markers telling if the run is still in progress or how it ended,\
        \ the outputs of the workflow, and what the run called."
      required:
      - id
      - documentId
      - documentTitle
      - documentVersion
      - workflowId
      - target
      - sources
      - status
      - startedDate
      - elapsedTime
      - steps
      properties:
        id:
          description: Unique identifier of WorkflowResult
          type: string
        number:
          format: int64
          description: Incremental number of the runs of the Arazzo document
          type: integer
        documentId:
          description: Unique identifier of the Arazzo document
          type: string
        documentTitle:
          description: Title of the Arazzo document
          type: string
        documentVersion:
          description: Version of the Arazzo document
          type: string
        workflowId:
          description: Identifier of the workflow run
          type: string
        target:
          $ref: '#/components/schemas/WorkflowRunTarget'
          description: What the run calls
        sources:
          description: Where each linked source description is called
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSourceTarget'
        secretRef:
          $ref: '#/components/schemas/SecretRef'
          description: The reference of the Secret whose authorization the calls
            carry
        inputs:
          description: The inputs of the workflow, by name
          type: object
          additionalProperties: {}
        outputs:
          description: The outputs of the workflow, by name, once the run is finished
          type: object
          additionalProperties: {}
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
          description: Status of the run; IN_PROGRESS until it is finished
        startedDate:
          format: int64
          description: Timestamp of the start of the run
          type: integer
        elapsedTime:
          format: int64
          description: Elapsed time of the run in milliseconds, once it is finished
          type: integer
        timeout:
          format: int64
          description: The maximum time (in milliseconds) a step waits for its response
          type: integer
        validateSchema:
          description: Whether each response is validated against the OpenAPI schema
            of its operation
          type: boolean
        steps:
          description: The result of each step, in their execution order
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepResult'
        message:
          description: Why the run failed when no step tells it
          type: string
        missingExample:
          $ref: '#/components/schemas/WorkflowMissingExample'
          description: The example the Microcks mocks lack for the failing step
            of a run against them
        example:
          $ref: '#/components/schemas/WorkflowExampleCheck'
          description: The recorded example the run plays, with its verdict once
            the run is finished
        origin:
          $ref: '#/components/schemas/WorkflowRunOrigin'
          description: Where the run was launched from; absent when it was launched
            from the Microcks UI or API
        session:
          $ref: '#/components/schemas/WorkflowSessionCheck'
          description: The verification session verified, when the origin is SESSION
    WorkflowExampleVerdict:
      description: Whether a run matches the recorded example it plays, apart from
        the status of the run, as an example may expect the workflow to fail
      enum:
      - MATCHES
      - DOES_NOT_MATCH
      type: string
    WorkflowStepExpectation:
      description: What a recorded example expects of a step of its workflow
      required:
      - stepId
      properties:
        stepId:
          description: Identifier of the step
          type: string
        status:
          description: The exact HTTP status code the step is expected to get
          type: integer
        outputs:
          description: The outputs the step is expected to produce, by name; only
            those listed are checked
          type: object
          additionalProperties: {}
    WorkflowExampleCheck:
      description: The recorded example a run plays, what it expects, and whether
        the run matches it
      required:
      - name
      properties:
        name:
          description: Name of the example
          type: string
        outputs:
          description: The outputs the workflow is expected to produce, by name;
            only those listed are checked
          type: object
          additionalProperties: {}
        steps:
          description: What each listed step is expected to show
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepExpectation'
        stopsAt:
          description: The step the workflow is expected to stop at; absent when
            it is expected to run to its end
          type: string
        verdict:
          $ref: '#/components/schemas/WorkflowExampleVerdict'
          description: Whether the run matches the example; absent while the run
            is in progress
        unmetExpectations:
          description: Each expectation the run does not meet
          type: array
          items:
            type: string
    WorkflowExampleLaunch:
      description: How the run of a recorded example was launched when running all
        the examples of a workflow
      required:
      - example
      properties:
        example:
          description: Name of the example
          type: string
        runId:
          description: Unique identifier of the WorkflowResult playing the example;
            absent when it was refused
          type: string
        number:
          format: int64
          description: Number of that run in its Arazzo document; absent when it
            was refused
          type: integer
        refusal:
          description: Why the example could not run; absent when it runs
          type: string
    ErrorResponse:
      description: Error returned as a JSON object
      type: object
      properties:
        error:
          description: Code or message of the error
          type: string
      example: |-
        {
            "error": "Role must be user or manager"
        }
    VersionInfo:
      description: Version of the running Microcks
      type: object
      properties:
        versionId:
          description: Version of Microcks
          type: string
        buildTimestamp:
          description: When this version was built
          type: string
      example: |-
        {
            "versionId": "2.0.0",
            "buildTimestamp": "2026-11-20T10:15:00Z"
        }
    AuthInfo:
      description: Authentication configuration of Microcks
      required:
      - enabled
      - oidcEnabled
      type: object
      properties:
        enabled:
          description: Whether authentication is enabled
          type: boolean
        oidcEnabled:
          description: Whether an OpenID Connect login is offered
          type: boolean
    UserInfo:
      description: The authenticated user
      type: object
      properties:
        name:
          description: Full name
          type: string
        username:
          description: Login name
          type: string
        givenName:
          type: string
        familyName:
          type: string
        email:
          type: string
        roles:
          description: "Roles of the user: user, manager or admin"
          type: array
          items:
            type: string
        groups:
          description: Paths of the Groups the user belongs to
          type: array
          items:
            type: string
      example: |-
        {
            "name": "Jane Doe",
            "username": "jane",
            "email": "jane@example.com",
            "roles": ["user"],
            "groups": ["/microcks/manager/payments"]
        }
    AccessToken:
      description: Access token of a Service Account
      required:
      - access_token
      - token_type
      - expires_in
      type: object
      properties:
        access_token:
          description: Signed JWT to send as a bearer token
          type: string
        token_type:
          enum:
          - Bearer
          type: string
        expires_in:
          format: int64
          description: Validity of the token, in seconds
          type: integer
    Group:
      description: A Group of users, to restrict the Services its members manage
      required:
      - name
      type: object
      properties:
        id:
          description: Unique identifier of the Group
          type: string
        name:
          description: Unique name of the Group. It contains no slash or space
          type: string
        description:
          type: string
    GroupRequest:
      description: Group to create
      required:
      - name
      type: object
      properties:
        name:
          description: Unique name of the Group. It contains no slash or space
          type: string
        description:
          type: string
    Membership:
      description: The membership of a user in a Group
      type: object
      properties:
        id:
          description: Unique identifier of the Membership
          type: string
        groupName:
          type: string
        role:
          description: Role of the member in the Group
          enum:
          - user
          - manager
          type: string
        subject:
          description: Username of the member. Absent while the membership is pending
          type: string
        email:
          description: Email the membership waits for. Absent once bound to a user
          type: string
        pending:
          description: Whether the membership is not yet bound to a user
          type: boolean
    MemberRequest:
      description: Member to add to a Group. Give either a subject or an email
      required:
      - role
      type: object
      properties:
        role:
          enum:
          - user
          - manager
          type: string
        subject:
          description: Username of the member
          type: string
        email:
          description: Email of a person who did not log in yet
          type: string
    User:
      description: A user who logged in Microcks
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        idpSubject:
          description: Subject of the user at the identity provider
          type: string
        name:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        roles:
          type: array
          items:
            type: string
        createdAt:
          format: date-time
          type: string
        lastLoginAt:
          format: date-time
          type: string
        disabled:
          description: Whether an admin disabled this user
          type: boolean
    UserUpdate:
      description: Change to apply to a User
      required:
      - disabled
      type: object
      properties:
        disabled:
          type: boolean
    ServiceAccount:
      description: A Service Account, for the CLI and CI/CD pipelines
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            type: string
    ServiceAccountRequest:
      description: Service Account to create
      required:
      - clientId
      - roles
      type: object
      properties:
        clientId:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            enum:
            - user
            - manager
            - admin
            type: string
    ServiceAccountCreated:
      description: Created Service Account, with its generated secret
      type: object
      properties:
        clientId:
          type: string
        clientSecret:
          description: Generated secret. It cannot be read again
          type: string
    GenericResourceServiceDTO:
      description: Generic Service to create
      required:
      - name
      - version
      - resource
      type: object
      properties:
        name:
          description: Name of the Service
          type: string
        version:
          description: Version of the Service
          type: string
        resource:
          description: Name of the resource the Service manages
          type: string
        referencePayload:
          description: JSON payload used as the reference of the resource
          type: string
      example: |-
        {
            "name": "Pastry",
            "version": "1.0",
            "resource": "pastry",
            "referencePayload": "{\"name\": \"Eclair\", \"price\": 2.5}"
        }
    GenericResource:
      description: A resource managed by a generic Service
      type: object
      properties:
        id:
          type: string
        serviceId:
          type: string
        payload:
          description: JSON payload of the resource, with its id
          type: object
          additionalProperties: {}
        reference:
          description: Whether this payload is the reference of the Service
          type: boolean
    ExchangeSelection:
      description: Exchanges selected in a Service, by operation
      required:
      - serviceId
      - exchanges
      type: object
      properties:
        serviceId:
          type: string
        exchanges:
          description: Names of the selected exchanges, by operation name
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    GenerationTask:
      description: Asynchronous generation of samples
      type: object
      properties:
        taskId:
          description: Identifier to give to the status endpoint
          type: string
    GenerationTaskStatus:
      description: Status of an asynchronous generation of samples
      type: object
      properties:
        status:
          enum:
          - PENDING
          - SUCCESS
          - FAILURE
          - NOT_FOUND
          type: string
    SpanData:
      description: A span of an OpenTelemetry trace, as recorded by Microcks
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
        spanContext:
          type: object
          additionalProperties: {}
        parentSpanContext:
          type: object
          additionalProperties: {}
        status:
          type: object
          additionalProperties: {}
        startEpochNanos:
          format: int64
          type: integer
        endEpochNanos:
          format: int64
          type: integer
        attributes:
          type: object
          additionalProperties: {}
        events:
          type: array
          items:
            type: object
            additionalProperties: {}
    ArazzoImportRequest:
      description: Arazzo document to analyse or import
      required:
      - content
      type: object
      properties:
        content:
          description: Content of the Arazzo document, as YAML or JSON
          type: string
        fileName:
          description: Name of the file the document comes from
          type: string
        links:
          description: API each source description is linked to, by source name.
            A source description left out is matched automatically when possible
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServiceRef'
    ArazzoLinksRequest:
      description: APIs the source descriptions of an Arazzo document are linked to
      type: object
      properties:
        links:
          description: API each source description is linked to, by source name
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServiceRef'
    ArazzoSourceLink:
      description: The API a source description of an Arazzo document is linked to
      type: object
      properties:
        sourceName:
          type: string
        apiName:
          type: string
        apiVersion:
          type: string
        linked:
          description: Whether the source description is linked to an API
          type: boolean
    ArazzoSourceInfo:
      description: A source description of an imported Arazzo document
      type: object
      properties:
        link:
          $ref: '#/components/schemas/ArazzoSourceLink'
        apiId:
          description: Unique identifier of the linked Service or API
          type: string
        apiType:
          enum:
          - SOAP_HTTP
          - REST
          - GENERIC_REST
          - EVENT
          - GENERIC_EVENT
          - GRPC
          - GRAPHQL
          type: string
    ArazzoLastResult:
      description: Outcome of the last run of a workflow
      enum:
      - NEVER_RUN
      - IN_PROGRESS
      - PASSED
      - FAILED
      type: string
    ArazzoWorkflowSummary:
      description: A workflow of an imported Arazzo document, in a list
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ArazzoWorkflowStatus'
        description:
          type: string
        stepCount:
          type: integer
        lastResult:
          $ref: '#/components/schemas/ArazzoLastResult'
        lastRun:
          $ref: '#/components/schemas/WorkflowRunSummary'
    ArazzoWorkflowStatus:
      description: Whether a workflow can run, and why not
      type: object
      properties:
        workflowId:
          type: string
        runnable:
          type: boolean
        reasons:
          description: Why the workflow cannot run
          type: array
          items:
            type: string
    ArazzoDocumentSummary:
      description: An imported Arazzo document
      type: object
      properties:
        id:
          description: Unique identifier of the Arazzo document
          type: string
        title:
          type: string
        version:
          type: string
        arazzoVersion:
          description: Version of the Arazzo specification of the document
          type: string
        fileName:
          type: string
        importDate:
          format: date-time
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoSourceInfo'
        workflows:
          description: Summary of each workflow of the document
          type: array
          items:
            $ref: '#/components/schemas/ArazzoWorkflowSummary'
    WorkflowRunSummary:
      description: A workflow run, in a list
      type: object
      properties:
        id:
          description: Unique identifier of the WorkflowResult
          type: string
        number:
          format: int64
          description: Number of the run among the runs of the document
          type: integer
        workflowId:
          type: string
        target:
          $ref: '#/components/schemas/WorkflowRunTarget'
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        failedStepId:
          description: Identifier of the first step that failed
          type: string
        startedDate:
          format: date-time
          type: string
        elapsedTime:
          format: int64
          description: Duration of the run, in milliseconds
          type: integer
        example:
          description: Name of the recorded example the run plays
          type: string
        exampleVerdict:
          $ref: '#/components/schemas/WorkflowExampleVerdict'
        origin:
          $ref: '#/components/schemas/WorkflowRunOrigin'
    WorkflowRunCounts:
      description: Number of runs of an Arazzo document
      type: object
      properties:
        total:
          format: int64
          type: integer
        passed:
          format: int64
          type: integer
        failed:
          format: int64
          type: integer
    ArazzoSourceMatch:
      description: How a source description matches an API of Microcks
      type: object
      properties:
        status:
          enum:
          - MATCHED
          - NO_API
          - UNREADABLE
          type: string
        contractTitle:
          type: string
        contractVersion:
          type: string
    ArazzoSourceAnalysis:
      description: Analysis of a source description of an Arazzo document
      type: object
      properties:
        sourceName:
          type: string
        declaredUrl:
          description: URL of the contract, as the document declares it
          type: string
        match:
          $ref: '#/components/schemas/ArazzoSourceMatch'
        link:
          $ref: '#/components/schemas/ArazzoSourceLink'
        operationCount:
          description: Number of operations of the contract
          type: integer
        foundOperationCount:
          description: Number of operations the steps use that the API has
          type: integer
        unresolvedStepCount:
          description: Number of steps whose operation cannot be found
          type: integer
    ArazzoWorkflowCheck:
      description: Whether a workflow of an Arazzo document could run
      type: object
      properties:
        workflowId:
          type: string
        runnable:
          type: boolean
        apiNames:
          type: array
          items:
            type: string
        unlinkedSources:
          type: array
          items:
            type: string
        reasons:
          type: array
          items:
            type: string
    ArazzoImportAnalysis:
      description: What importing an Arazzo document would give
      type: object
      properties:
        refusal:
          description: Why the document is refused. Absent when it can be imported
          type: string
        arazzoVersion:
          type: string
        title:
          type: string
        version:
          type: string
        workflowIds:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoSourceAnalysis'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoWorkflowCheck'
        apis:
          description: APIs of Microcks a source description can be linked to
          type: array
          items:
            $ref: '#/components/schemas/ServiceRef'
        warnings:
          type: array
          items:
            type: string
    ArazzoSourceDescription:
      description: A source description of an Arazzo document, with its API
      type: object
      properties:
        link:
          $ref: '#/components/schemas/ArazzoSourceLink'
        serviceId:
          type: string
        reason:
          description: Why the source description cannot be used
          type: string
        operations:
          description: Number of operations of the API
          type: integer
        usedOperations:
          description: Number of operations the workflow uses
          type: integer
    ArazzoExpressionUse:
      description: Where an expression is used in a workflow
      type: object
      properties:
        stepId:
          type: string
        place:
          description: Where in the step the expression is used
          type: string
        target:
          type: string
    ArazzoWorkflowInput:
      description: An input of a workflow
      type: object
      properties:
        name:
          type: string
        usedBy:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoExpressionUse'
        type:
          type: string
        required:
          type: boolean
    ArazzoStepOperation:
      description: The operation a step calls
      type: object
      properties:
        sourceName:
          type: string
        operationId:
          type: string
        method:
          type: string
        path:
          type: string
        reason:
          description: Why the operation cannot be found
          type: string
        channel:
          description: Channel of an event step
          type: string
    ArazzoStepParameter:
      description: A parameter a step sends
      type: object
      properties:
        name:
          type: string
        in:
          type: string
        value:
          type: string
    ArazzoStepRequestBody:
      description: The request body of a step
      type: object
      properties:
        contentType:
          type: string
        payload:
          type: string
        replacements:
          type: object
          additionalProperties:
            type: string
    ArazzoStepCriterion:
      description: A criterion of a step
      type: object
      properties:
        condition:
          type: string
        context:
          type: string
        type:
          type: string
    ArazzoStepAction:
      description: What a step does on success or failure
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        retryAfter:
          format: double
          type: number
        retryLimit:
          type: integer
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoStepCriterion'
    ArazzoStepMessaging:
      description: Messaging settings of an event step
      type: object
      properties:
        action:
          type: string
        correlationId:
          type: string
        timeout:
          format: int64
          type: integer
    ArazzoStepDetail:
      description: A step of a workflow
      type: object
      properties:
        stepId:
          type: string
        description:
          type: string
        operation:
          $ref: '#/components/schemas/ArazzoStepOperation'
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoStepParameter'
        requestBody:
          $ref: '#/components/schemas/ArazzoStepRequestBody'
        successCriteria:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoStepCriterion'
        outputs:
          type: object
          additionalProperties:
            type: string
        onSuccess:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoStepAction'
        onFailure:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoStepAction'
        messaging:
          $ref: '#/components/schemas/ArazzoStepMessaging'
        dependsOn:
          type: array
          items:
            type: string
        prerequisites:
          type: array
          items:
            type: string
    ArazzoDataPassing:
      description: An output of a step that another step uses
      type: object
      properties:
        fromStepId:
          type: string
        outputName:
          type: string
        to:
          $ref: '#/components/schemas/ArazzoExpressionUse'
    ArazzoWorkflowExample:
      description: A recorded example of a workflow
      type: object
      properties:
        workflowId:
          type: string
        name:
          type: string
        inputs:
          type: object
          additionalProperties: {}
        outputs:
          type: object
          additionalProperties: {}
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepExpectation'
        stopsAt:
          description: Identifier of the step the workflow is expected to stop at
          type: string
    ArazzoWorkflowDetail:
      description: A workflow of an imported Arazzo document, with its document
      type: object
      properties:
        documentId:
          type: string
        title:
          type: string
        version:
          type: string
        arazzoVersion:
          type: string
        fileName:
          type: string
        importDate:
          format: date-time
          type: string
        workflowIds:
          description: Identifiers of the workflows of the document
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoSourceDescription'
        workflowId:
          type: string
        summary:
          type: string
        description:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoWorkflowInput'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoStepDetail'
        outputs:
          type: object
          additionalProperties:
            type: string
        dataPassings:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoDataPassing'
        status:
          $ref: '#/components/schemas/ArazzoWorkflowStatus'
        examples:
          type: array
          items:
            $ref: '#/components/schemas/ArazzoWorkflowExample'
    ArazzoApiUsage:
      description: The Arazzo workflows that use an API
      type: object
      properties:
        documents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              version:
                type: string
              workflows:
                type: array
                items:
                  type: object
                  properties:
                    workflowId:
                      type: string
                    lastResult:
                      $ref: '#/components/schemas/ArazzoLastResult'
        operationWorkflowCounts:
          description: Number of workflows that use each operation of the API
          type: object
          additionalProperties:
            type: integer
    ArazzoStepReport:
      description: A step played by the Arazzo minion, reported to Microcks
      required:
      - index
      - stepId
      - operation
      - status
      - elapsedTime
      - criteria
      - parameters
      type: object
      properties:
        index:
          type: integer
        stepId:
          type: string
        operation:
          $ref: '#/components/schemas/WorkflowStepOperation'
        status:
          $ref: '#/components/schemas/WorkflowStepStatus'
        statusCode:
          type: integer
        elapsedTime:
          format: int64
          type: integer
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowCriterionResult'
        outputs:
          type: object
          additionalProperties: {}
        request:
          type: object
          properties:
            method:
              type: string
            url:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              type: string
        response:
          type: object
          properties:
            status:
              type: integer
            headers:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            body:
              type: string
        message:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowParameterValue'
        outputOrigins:
          type: object
          additionalProperties:
            type: string
    ArazzoRunOutcome:
      description: The outcome of a run, reported by the Arazzo minion to Microcks
      required:
      - status
      - elapsedTime
      type: object
      properties:
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        outputs:
          type: object
          additionalProperties: {}
        elapsedTime:
          format: int64
          type: integer
        message:
          type: string
  responses:
    ServiceResponse:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Service'
            - $ref: '#/components/schemas/ServiceView'
      description: ""
  securitySchemes:
    jwt-bearer:
      flows:
        clientCredentials:
          tokenUrl: http://microcks.example.com/api/auth/token
          scopes:
            user: Simple authenticated user
            manager: Services & APIs content manager
            admin: Administrator of the Microcks instance
      type: oauth2
      description: JWT Bearer acquired from /auth/token with the OAuth 2 client credentials
        flow of a Service Account, or from the OpenID Connect login of the web application
security:
- jwt-bearer: []
tags:
- name: mock
  description: Operations related to API and Services mocks
- name: test
  description: Operations related to API and Services tests
- name: job
  description: Operations related to Jobs for discovering mocks and tests
- name: config
  description: Operations related to configuration
- name: metrics
  description: Operations related to metrics
- name: webhook
  description: Operations related to Webhook registrations for Service Operations
- name: workflow
  description: Operations related to Arazzo documents, workflows and runs
- name: auth
  description: Operations related to authentication
- name: admin
  description: Operations related to Groups, users and Service Accounts
- name: copilot
  description: Operations related to the AI Copilot samples
- name: trace
  description: Operations related to traces of mock invocations
