  /webhooks/operation/{operationId}/count:
    get:
      tags:
      - webhook
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counter'
          description: Number of Webhook registrations for this Operation in datastore
      security:
      - jwt-bearer:
        - user
      operationId: CountWebhookRegistrationsForOperation
      summary: Count Webhook registrations for an Operation
    parameters:
    - name: operationId
      description: Unique identifier of the Operation to count Webhook registrations
        for (formatted as {serviceId}-{operationName})
      schema:
        type: string
      in: path
      required: true
  /arazzo/documents/{documentId}/workflows/{workflowId}/runs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunRequest'
        required: true
      tags:
      - workflow
      responses:
        "201":
          headers:
            Location:
              description: URL of the created WorkflowResult, to read until it is
                no longer in progress
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
          description: Created WorkflowResult (in progress, as workflows are run
            asynchronously by the Arazzo minion)
        "400":
          content:
            text/plain:
              schema:
                type: string
              example: "Unknown workflow: deleteAll"
          description: "The run is refused and no WorkflowResult is created. The\
            \ body tells why: the workflow is unknown, cannot run, has steps that\
            \ send or receive messages (async steps cannot be run yet), misses\
            \ an input, misses the base URL of a source, the secret is unknown,\
            \ or the workflow has no such recorded example"
        "404":
          description: No Arazzo document has this identifier, or this title and
            version
      security:
      - jwt-bearer:
        - user
      operationId: LaunchWorkflowRun
      summary: Run a workflow of an Arazzo document
      description: Run a workflow against the Microcks mocks of the APIs its source
        descriptions are linked to, or against their implementations when a base
        URL is given for each linked source. The run is executed asynchronously;
        read it with GetWorkflowRun until its status is no longer IN_PROGRESS.
    parameters:
    - name: documentId
      description: "Unique identifier of the Arazzo document, or its title and version\
        \ as {title}:{version} (for example API Pastry scenarios:1.0.0)"
      schema:
        type: string
      in: path
      required: true
    - name: workflowId
      description: Identifier of the workflow in the Arazzo document
      schema:
        type: string
      in: path
      required: true
  /arazzo/documents/{documentId}/workflows/{workflowId}/examples/runs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunRequest'
        required: true
      tags:
      - workflow
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowExampleLaunch'
          description: How the run of each recorded example of the workflow was
            launched, in the order of the examples; empty when the workflow has
            none
        "400":
          content:
            text/plain:
              schema:
                type: string
              example: "Unknown workflow: deleteAll"
          description: The workflow is unknown and no WorkflowResult is created
        "404":
          description: No Arazzo document has this identifier, or this title and
            version
      security:
      - jwt-bearer:
        - user
      operationId: LaunchWorkflowExampleRuns
      summary: Run every recorded example of a workflow of an Arazzo document
      description: Play every example recorded for the workflow in the ArazzoExamples
        of its document, one run per example, with the inputs of the example.
        The inputs and example of the request are not used. An example that cannot
        run is refused with its reason while the others run. Each run is executed
        asynchronously; read it with GetWorkflowRun until its status is no longer
        IN_PROGRESS, then read whether it matches its example.
    parameters:
    - name: documentId
      description: "Unique identifier of the Arazzo document, or its title and version\
        \ as {title}:{version} (for example API Pastry scenarios:1.0.0)"
      schema:
        type: string
      in: path
      required: true
    - name: workflowId
      description: Identifier of the workflow in the Arazzo document
      schema:
        type: string
      in: path
      required: true
  /arazzo/runs/{runId}:
    get:
      tags:
      - workflow
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
          description: Requested WorkflowResult
        "404":
          description: No WorkflowResult has this identifier
      security:
      - jwt-bearer:
        - user
      operationId: GetWorkflowRun
      summary: Get WorkflowResult
      description: Read a workflow run, with its status, its outputs and the result
        of each of its steps.
    parameters:
    - name: runId
      description: Unique identifier of the WorkflowResult
      schema:
        type: string
      in: path
      required: true
  /arazzo/sessions:
    get:
      tags:
      - workflow
      parameters:
      - name: documentId
        description: "Unique identifier of the Arazzo document, or its title and\
          \ version as {title}:{version}"
        schema:
          type: string
        in: query
        required: true
      - name: workflowId
        description: Identifier of the workflow in the Arazzo document
        schema:
          type: string
        in: query
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArazzoSession'
          description: The sessions opened on the workflow that are still kept,
            the latest opened first. Empty when the document does not exist
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: documentId or workflowId is missing
      security:
      - jwt-bearer:
        - user
      operationId: ListArazzoSessions
      summary: List the verification sessions of a workflow
      description: "List the sessions opened on a workflow: the open ones, and the\
        \ closed ones that are still kept for their retention delay. Each tells\
        \ how many calls the mocks recorded so far."
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArazzoSessionRequest'
        required: true
      tags:
      - workflow
      responses:
        "201":
          headers:
            Location:
              description: URL of the created ArazzoSession
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArazzoSession'
          description: Created ArazzoSession, open. The mocks record the calls
            naming its identifier
        "400":
          content:
            text/plain:
              schema:
                type: string
              example: "Unknown workflow: cancelSaga"
          description: "The session is refused and none is created. The body tells\
            \ why: the workflow is unknown, one of its steps calls no operation of\
            \ a linked API, an input given is unknown, of another type than the\
            \ workflow declares, or an input the workflow needs is missing, or a\
            \ failure names a step the workflow does not have or an example the\
            \ operation of its step does not have"
        "404":
          description: No Arazzo document has this identifier, or this title and
            version
      security:
      - jwt-bearer:
        - user
      operationId: OpenArazzoSession
      summary: Open a verification session on a workflow
      description: "Open a session to verify that an application follows a workflow\
        \ of an Arazzo document against the Microcks mocks. The application names\
        \ the session in each call it makes to the mocks, with the x-microcks-session\
        \ header (or gRPC metadata), or with the microcks-session entry of its W3C\
        \ baggage header; the mocks record these calls in their order of receipt,\
        \ until the session is closed or expires, up to a maximum of calls. Then\
        \ ask for the verification of the session. To verify how the application\
        \ compensates a refusal, set steps to fail with failures: in this session\
        \ only, the mocks answer the operation of each such step with the chosen\
        \ existing example, its status, headers and body."
  /arazzo/sessions/{sessionId}:
    get:
      tags:
      - workflow
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArazzoSession'
          description: The ArazzoSession, with the number of calls it recorded
            so far
        "404":
          description: No ArazzoSession has this identifier, or it expired
      security:
      - jwt-bearer:
        - user
      operationId: GetArazzoSession
      summary: Read a verification session
      description: Read a verification session, open or closed, without verifying
        it. Its callCount is up to date with the calls the mocks recorded.
    delete:
      tags:
      - workflow
      responses:
        "204":
          description: The ArazzoSession is closed. It records no more calls, and
            it is kept with its calls, to be verified, for a retention delay
        "404":
          description: No ArazzoSession has this identifier
      security:
      - jwt-bearer:
        - user
      operationId: CloseArazzoSession
      summary: Close a verification session
      description: Close a verification session, so that the mocks record no more
        calls in it.
    parameters:
    - name: sessionId
      description: Unique identifier of the ArazzoSession
      schema:
        type: string
      in: path
      required: true
  /arazzo/sessions/{sessionId}/verification:
    post:
      tags:
      - workflow
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
          description: "The verification, a WorkflowResult whose origin is SESSION:\
            \ the result of the steps of the workflow, each with the call it was\
            \ matched to. It is kept in the runs history of the Arazzo document.\
            \ A session that reached its maximum of calls fails, its message telling\
            \ how many calls it did not record."
        "404":
          description: No ArazzoSession has this identifier
      security:
      - jwt-bearer:
        - user
      operationId: VerifyArazzoSession
      summary: Verify that the calls of a session follow its workflow
      description: Verify that the calls the mocks recorded in a session follow
        the steps of its workflow.
    parameters:
    - name: sessionId
      description: Unique identifier of the ArazzoSession
      schema:
        type: string
      in: path
      required: true
