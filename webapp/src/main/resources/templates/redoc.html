<!DOCTYPE html>
<html>
  <head>
    <title>Microcks-UI - API Documentation</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">

    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="redoc-container">Loading API documentation…</div>
    <script type="module">
      import { init } from "/assets/redoc/redoc.standalone.js";

      const specUrl = "{RESOURCE_URL}";
      init(specUrl, { disableTelemetry: true, downloadUrls: [{ url: specUrl, title: "Download API description" }] },
        document.getElementById("redoc-container"));
    </script>
  </body>
</html>
