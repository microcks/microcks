opencollection: 1.0.0
info:
  name: Petstore API
  version: "1.0"
items:
  - info:
      name: Find pet by ID
      type: http
    http:
      method: GET
      url: "{{baseUrl}}/pet/:petId"
    # Each example is named after its body type, or after the header that gives its media type.
    examples:
      # A Content-Type header, whatever its case, gives the media type instead of the body type.
      - name: content-type header
        response:
          status: 200
          headers:
            - name: content-type
              value: application/vnd.petstore+json
          body:
            type: text
            data: ""
      - name: json
        response:
          status: 200
          # Another header than Content-Type must not give the media type.
          headers:
            - name: X-Rate-Limit
              value: "10"
          body:
            type: json
            data: ""
      - name: xml
        response:
          status: 200
          body:
            type: xml
            data: ""
      - name: text
        response:
          status: 200
          body:
            type: text
            data: ""
      - name: html
        response:
          status: 200
          body:
            type: html
            data: ""
      - name: binary
        response:
          status: 200
          body:
            type: binary
            data: ""
bundled: true
