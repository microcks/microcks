opencollection: 1.0.0
info:
  name: Demo Task Manager
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: task
      type: folder
      seq: 1
    request:
      auth:
        type: bearer
        token: ''
    items:
      - info:
          name: Delete Task
          type: http
          seq: 3
        http:
          method: DELETE
          url: http://localhost:3000/api/v1/tasks/8
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
      - info:
          name: Create Task
          type: http
          seq: 2
        http:
          method: POST
          url: http://localhost:3000/api/v1/tasks
          body:
            type: json
            data: |-
              {
                "title": "Write the report"
              }
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
      - info:
          name: List Tasks
          type: http
          seq: 1
        http:
          method: GET
          url: http://localhost:3000/api/v1/tasks
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
