opencollection: 1.0.0
info:
  name: ""
  version: "1.0"
items:
  - info:
      name: pet
      type: folder
    items:
      - info:
          name: Find pets by status
          type: http
        http:
          method: GET
          url: "{{baseUrl}}/pet/findByStatus?status=available"
          params:
            - name: status
              value: available
              type: query
      - info:
          name: Get pet by id
          type: http
        http:
          method: GET
          url: "{{baseUrl}}/pet/:petId"
          params:
            - name: petId
              value: "1"
              type: path
bundled: true
