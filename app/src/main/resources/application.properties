%prod.quarkus.mongodb.connection-string=${MONGODB_URL:mongodb://localhost:27017}
# Dev: Dev Services cannot mount a volume nor survive a restart, so dev mode uses the persistent MongoDB of dev/compose.yaml.
%dev.quarkus.mongodb.devservices.enabled=false
%dev.quarkus.mongodb.connection-string=${MONGODB_URL:mongodb://localhost:27018}
# Dev: also log to a file so the log can be read without the terminal.
%dev.quarkus.log.file.enable=true
%dev.quarkus.log.file.path=${LOG_FILE:../dev/app.log}
quarkus.mongodb.database=${MONGODB_DATABASE:microcks}
# Same as v1 (WriteConcern.ACKNOWLEDGED), whatever the connection string says.
quarkus.mongodb.write-concern.safe=true
quarkus.mongodb.write-concern.w=1
quarkus.config.locations=config/features.properties,/deployments/config/features.properties

# HTTP server
quarkus.http.limits.max-form-attribute-size=${MAX_UPLOAD_FILE_SIZE:2M}
quarkus.http.limits.max-body-size=${MAX_UPLOAD_FILE_SIZE:2M}
quarkus.http.enable-compression=true
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=true
quarkus.jackson.write-dates-as-timestamps=true
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.fail-on-empty-beans=false

# External services
tests-callback.url=${TEST_CALLBACK_URL:http://localhost:8080}
postman-runner.url=${POSTMAN_RUNNER_URL:http://localhost:3000}
async-minion.url=${ASYNC_MINION_URL:http://localhost:8081}
default-artifacts-repository.url=${DEFAULT_ARTIFACTS_REPOSITORY_URL:}

network.proxyHost=${PROXY_HOST:}
network.proxyPort=${PROXY_PORT:}
network.proxyUsername=${PROXY_USERNAME:}
network.proxyPassword=${PROXY_PASSWORD:}
network.nonProxyHosts=${PROXY_EXCLUDE:localhost|127.0.0.1|*.svc.cluster.local}

validation.resourceUrl=http://localhost:8080/api/resources/
services.update.interval=${SERVICES_UPDATE_INTERVAL:0 0 0/2 * * ?}

# Mocks
mocks.enable-invocation-stats=${ENABLE_INVOCATION_STATS:true}
mocks.enable-binary-response-decode=${ENABLE_BINARY_RESPONSE_DECODE:false}
mocks.rest.enable-cors-policy=${ENABLE_CORS_POLICY:true}
mocks.rest.cors.allowedOrigins=${CORS_REST_ALLOWED_ORIGINS:*}
mocks.rest.cors.allowCredentials=${CORS_REST_ALLOW_CREDENTIALS:false}

# Async mocking support.
async-api.enabled=true
async-api.default-binding=KAFKA
async-api.default-frequency=3

# Cluster event bus (Hazelcast) relaying service updates and AsyncAPI triggers between replicas, so that an async
# minion connected by WebSocket to any replica receives them. Discovery modes: standalone (default, single member),
# kubernetes (service-name or service-dns of a headless service), tcp-ip (members list: host[:port],host[:port]).
microcks.cluster.enabled=true
microcks.cluster.discovery=${MICROCKS_CLUSTER_DISCOVERY:standalone}
microcks.cluster.name=${MICROCKS_CLUSTER_NAME:microcks}
microcks.cluster.port=${MICROCKS_CLUSTER_PORT:5701}
microcks.cluster.members=${MICROCKS_CLUSTER_MEMBERS:}
microcks.cluster.kubernetes.namespace=${KUBERNETES_NAMESPACE:}
microcks.cluster.kubernetes.service-name=${MICROCKS_CLUSTER_SERVICE_NAME:microcks}
microcks.cluster.kubernetes.service-dns=${MICROCKS_CLUSTER_SERVICE_DNS:}
quarkus.log.category."com.hazelcast.system.logo".level=OFF

# gRPC mocks are served by Vert.x gRPC on the main HTTP port (HTTP/2), see VertxGrpcMockServer.
grpc.vertx.enabled=true

# CORS (applies to all paths, as the former /api, /dynarest, /rest, /soap and /graphql filters)
quarkus.http.cors.enabled=${ENABLE_CORS_POLICY:true}
quarkus.http.cors.origins=${CORS_REST_ALLOWED_ORIGINS:*}
quarkus.http.cors.methods=POST,PUT,GET,OPTIONS,DELETE
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-max-age=1H
quarkus.http.cors.access-control-allow-credentials=${CORS_REST_ALLOW_CREDENTIALS:false}

# Logging (levels formerly set in logback.xml)
quarkus.log.level=INFO
quarkus.log.category."io.microcks".level=INFO
quarkus.log.category."org.mongodb".level=INFO
quarkus.log.category."org.apache".level=WARN
quarkus.log.category."org.bson".level=WARN
quarkus.log.category."org.hibernate.validator".level=WARN
quarkus.log.category."sun.net.www.protocol.http".level=INFO
quarkus.log.category."jdk.event.security".level=WARN
quarkus.log.category."javax.xml.bind".level=WARN
quarkus.log.category."com.sun.xml.internal.bind".level=WARN
quarkus.log.category."sun.rmi.transport".level=WARN
%test.quarkus.log.category."org.testcontainers".level=INFO
%test.quarkus.log.category."com.github.dockerjava".level=WARN

# Test conformance computation config
test-conformance.trend-size=3
test-conformance.trend-history-size=10

# AI Copilot configuration properties
ai-copilot.enabled=false
ai-copilot.implementation=openai
ai-copilot.openai.api-key=sk-my-openai-api-key
ai-copilot.openai.timeout=30
ai-copilot.openai.maxTokens=3000

# Authentication (M2-002): disabled by default, every caller then has all roles (user, manager, admin).
# When enabled, the API validates Microcks-issued JWT tokens. Provide a shared RSA key pair (PKCS#8 / X.509 PEM)
# when running several replicas, otherwise an ephemeral key is generated at startup.
microcks.auth.enabled=${MICROCKS_AUTH_ENABLED:false}
microcks.auth.issuer=${MICROCKS_AUTH_ISSUER:microcks}
microcks.auth.token-ttl=${MICROCKS_AUTH_TOKEN_TTL:PT2H}

# Tests
%test.async-api.enabled=false
%test.microcks.cluster.enabled=false
