# Adds the async minion to docker-compose.yml (or docker-compose-cluster.yml):
#   docker compose -f docker-compose.yml -f async-addon.yml up -d
# The minion connects to the app through WebSocket (events) and REST (full resync on each connection). No broker is
# needed for that. Add kafka-addon.yml, nats-addon.yml or rabbitmq-addon.yml to mock these protocols.
services:
  app:
    environment:
      - ASYNC_MINION_URL=http://microcks-async-minion:8081
      # Only needed when MICROCKS_AUTH_ENABLED=true: declares the service account the minion authenticates with.
      #- MICROCKS_AUTH_BOOTSTRAP_CLIENT_ID=microcks-serviceaccount
      #- MICROCKS_AUTH_BOOTSTRAP_CLIENT_SECRET=change-me

  async-minion:
    depends_on:
      - app
    ports:
      - "8081:8081"
    image: quay.io/microcks/microcks-async-minion:nightly
    container_name: microcks-async-minion
    restart: on-failure
    volumes:
      - "./config:/deployments/config"
    environment:
      - QUARKUS_PROFILE=docker-compose
      #- MICROCKS_SERVICEACCOUNT=microcks-serviceaccount
      #- MICROCKS_SERVICEACCOUNT_CREDENTIALS=change-me
      #- QUARKUS_LOG_CONSOLE_LEVEL=DEBUG
      #- QUARKUS_LOG_CATEGORY__IO_MICROCKS__LEVEL=DEBUG
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      start_period: 10s
      interval: 10s
      timeout: 2s
      retries: 3
