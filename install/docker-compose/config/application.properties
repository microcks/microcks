# Configuration of the async minion in docker-compose (profile docker-compose).

# Access to the Microcks app: REST for synchronization, and WebSocket (derived from this URL) for events.
%docker-compose.io.microcks.minion.async.client.MicrocksAPIConnector/mp-rest/url=http://microcks:8080

# Explicitly telling the minion the protocols we want to support. KAFKA needs the kafka-addon.yml broker.
%docker-compose.minion.supported-bindings=WS

# Access to the Kafka broker of kafka-addon.yml (and use KAFKA,WS as supported bindings).
# %docker-compose.kafka.bootstrap.servers=kafka:19092
# %docker-compose.minion.supported-bindings=KAFKA,WS

