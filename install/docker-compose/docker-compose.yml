# Microcks 2.0: a single app instance, no authentication, no Kafka. Events for the async minion (async-addon.yml)
# travel over a WebSocket, so nothing else than MongoDB and the Postman runtime is needed.
services:
  mongo:
    image: mongo:7.0
    container_name: microcks-db
    volumes:
      - "~/tmp/microcks-data:/data/db"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3

  postman:
    image: quay.io/microcks/microcks-postman-runtime:0.8.0
    container_name: microcks-postman-runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 5s
      interval: 20s
      timeout: 3s
      retries: 3

  app:
    depends_on:
      - mongo
      - postman
    image: quay.io/microcks/microcks-app:nightly
    container_name: microcks
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DATABASE=microcks
      - POSTMAN_RUNNER_URL=http://postman:3000
      - TEST_CALLBACK_URL=http://microcks:8080
      - SERVICES_UPDATE_INTERVAL=0 0 0/2 * * *
      #- QUARKUS_LOG_CATEGORY__IO_MICROCKS__LEVEL=DEBUG
      #- MAX_UPLOAD_FILE_SIZE=3MB
      # Authentication is disabled by default: everyone is an anonymous user with all roles. See README.md.
      #- MICROCKS_AUTH_ENABLED=true
