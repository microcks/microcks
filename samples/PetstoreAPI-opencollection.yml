opencollection: 1.0.0
info:
  name: Petstore API
  version: "1.0"
items:
  - info:
      name: pet
      type: folder
    items:
      - info:
          name: Find pets by status
          type: http
        http:
          method: GET
          url: "{{baseUrl}}/pet/findByStatus?status=available"
          params:
            - name: status
              value: available
              type: query
        examples:
          - name: available response
            request:
              url: "{{baseUrl}}/pet/findByStatus?status=available"
              method: GET
              params:
                - name: status
                  value: available
                  type: query
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  [
                    {"id": 190192062, "category": {"id": 0, "name": "string"}, "name": "doggie", "photoUrls": ["string"], "tags": [{"id": 0, "name": "string"}], "status": "available"},
                    {"id": 190192063, "category": {"id": 0, "name": "string"}, "name": "doggie", "photoUrls": ["string"], "tags": [{"id": 0, "name": "string"}], "status": "available"}
                  ]
      - info:
          name: Get pet by id
          type: http
        http:
          method: GET
          url: "{{baseUrl}}/pet/:petId"
          params:
            - name: petId
              value: "1"
              type: path
        examples:
          - name: get-2
            request:
              url: "{{baseUrl}}/pet/:petId"
              method: GET
              headers:
                - name: Accept
                  value: application/json
              params:
                - name: petId
                  value: "2"
                  type: path
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
                - name: X-Rate-Limit
                  value: "10"
              body:
                type: json
                data: '{"id":2,"category":{"id":1,"name":"Animal"},"name":"cat","photoUrls":["string"],"tags":[{"id":1,"name":"domestic"}],"status":"available"}'
          - name: get-1
            request:
              url: "{{baseUrl}}/pet/:petId"
              method: GET
              params:
                - name: petId
                  value: "1"
                  type: path
            response:
              status: 404
              statusText: Not Found
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: ""
      - info:
          name: Add a new pet
          type: http
        http:
          method: POST
          url: "{{baseUrl}}/pet"
        examples:
          - name: pet created
            request:
              url: "{{baseUrl}}/pet"
              method: POST
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: '{"name":"cat","photoUrls":["string"],"status":"available"}'
            response:
              status: 201
              statusText: Created
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: '{"id":3,"name":"cat","photoUrls":["string"],"status":"available"}'
bundled: true
